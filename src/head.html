<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>年度预算执行看板</title>
<style>
:root{
  --bg:#f4f6fa; --card:#fff; --line:#e5e9f2; --text:#1c2333; --muted:#6b7489;
  --blue:#3b6ef5; --blue-bg:#eef3fe; --green:#18a058; --green-bg:#e8f7ef;
  --amber:#d97706; --amber-bg:#fef3e2; --red:#dc2626; --red-bg:#fdecec;
  --teal:#0d9488; --teal-bg:#e6f7f5; --gray:#98a1b3; --purple:#7c5cd6;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;}
.sticky-head{position:sticky;top:0;z-index:30}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 24px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.topbar h1{font-size:18px;margin:0;display:flex;align-items:center;gap:10px}
.year-badge{background:var(--blue-bg);color:var(--blue);border-radius:8px;padding:2px 10px;font-size:13px;font-weight:600}
.banner{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:5px 12px;border-radius:8px;font-size:13px;max-width:100%}
.banner.warn{background:var(--amber-bg);color:var(--amber)}
.banner.ok{background:var(--green-bg);color:var(--green)}
.chip{background:#fff;border:1px solid currentColor;border-radius:12px;padding:0 8px;font-size:12px;white-space:nowrap}
.tabs{display:flex;gap:4px;padding:0 24px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{padding:10px 18px;border:none;background:none;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
main{padding:18px 24px 40px;max-width:1440px;margin:0 auto}
.tab-panel{display:none}
.tab-panel.active{display:block}
.summary-bar{background:linear-gradient(90deg,var(--blue),#5a8bff);color:#fff;border-radius:12px;padding:12px 18px;margin-top:16px;font-size:14px;line-height:1.8}
.summary-bar b{font-size:15px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi-label{font-size:12px;color:var(--muted)}
.kpi-value{font-size:19px;font-weight:700;margin:2px 0 1px;font-variant-numeric:tabular-nums}
.kpi-sub{font-size:11px;color:var(--muted)}
.kpi-value.c-green{color:var(--green)} .kpi-value.c-red{color:var(--red)} .kpi-value.c-blue{color:var(--blue)} .kpi-value.c-amber{color:var(--amber)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-top:16px}
.grid-2 .card{margin-top:0}
.card-title{font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.card-sub{font-size:12px;color:var(--muted);font-weight:400}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;color:var(--muted);font-weight:500;border-bottom:1px solid var(--line);padding:6px 8px;white-space:nowrap}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:#fafbfe}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tfoot td{font-weight:600;border-top:2px solid var(--line)}
.tbl-wrap{overflow-x:auto}
.st{padding:1px 8px;border-radius:10px;font-size:12px;white-space:nowrap}
.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:8px;padding:6px 14px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{opacity:.9;color:#fff}
.btn.danger{color:var(--red);border-color:#f3c1c1}
.btn.danger:hover{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.btn.small{padding:2px 9px;font-size:12px;border-radius:6px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted);font-size:12px}
.empty{color:var(--muted);font-size:13px;padding:18px 0;text-align:center}
.chart-box{position:relative;height:300px}
.cons-table{width:100%;font-size:13px;border-collapse:collapse}
.cons-table td{padding:4px 6px;border-bottom:1px dashed var(--line)}
.cons-table td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.cons-diff{padding:8px 12px;border-radius:8px;margin-top:8px;font-size:13px}
.cons-diff.ok{background:var(--green-bg);color:var(--green)}
.cons-diff.warn{background:var(--red-bg);color:var(--red)}
.cons-diff.info{background:var(--amber-bg);color:var(--amber)}
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;padding:56px 16px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:14px;padding:20px 22px;width:680px;max-width:100%;box-shadow:0 20px 50px rgba(15,23,42,.25)}
.modal h3{margin:0 0 12px;font-size:16px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:4px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px}
.field-label{color:var(--muted);font-size:12px}
.field input,.field select,textarea{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;width:100%;font-family:inherit}
.field input:focus,.field select:focus,textarea:focus{outline:none;border-color:var(--blue)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.dropzone{border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted);margin:10px 0;font-size:13px}
.dropzone.over{border-color:var(--blue);color:var(--blue);background:var(--blue-bg)}
.file-card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0}
.file-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;margin-bottom:6px}
.file-head select,.file-head input[type=date]{font-size:12px;padding:3px 6px;border:1px solid var(--line);border-radius:6px}
.onboard{background:#fff;border:1px dashed var(--blue);border-radius:12px;padding:22px;margin-top:16px;text-align:center}
.onboard h2{font-size:16px;margin:0 0 6px}
.wd-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.wd-grid .field input{padding:5px 8px}
/* 决策卡：操作指令块 / 年底推演 / 折叠的推演表 */
.ins{border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:10px;padding:10px 14px;margin-top:8px;background:#fbfcff}
.ins.ok{border-left-color:var(--green);background:var(--green-bg)}
.ins-head{font-size:15px;font-weight:600}
.ins-sub{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.7}
.ins-sub b{color:var(--text)}
.ye{border:1px dashed var(--line);border-radius:10px;padding:10px 14px;margin-top:12px;background:#fff}
.fold{margin-top:12px}
.fold summary{cursor:pointer;font-size:13px;color:var(--blue);font-weight:500;padding:4px 0}
.fold[open] summary{margin-bottom:6px}
.wl-line{font-size:12px;line-height:1.6;white-space:nowrap}
/* 决策卡里"下 PO"的两张图 */
.po-charts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.po-chart-title{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:2px}
@media(max-width:1100px){.po-charts{grid-template-columns:1fr}}
/* ===== 首页：待办 / 执行率 / 提醒 ===== */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;margin-top:16px}
.hero .card{margin-top:0}
@media(max-width:1100px){.hero{grid-template-columns:1fr}}
#tab-now.no-data .hero,#tab-now.no-data #poDecisionCard,#tab-now.no-data #srcCard,#tab-now.no-data #foldCard{display:none}
.lnk{color:var(--blue);cursor:pointer;font-size:12px;white-space:nowrap}
.lnk:hover{text-decoration:underline}
.sub{font-size:11px;color:var(--muted);font-weight:400;line-height:1.5}
.c-green{color:var(--green)} .c-red{color:var(--red)} .c-amber{color:var(--amber)} .c-blue{color:var(--blue)}
.todo{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.todo-body[title]{cursor:help}
.todo:last-child{border-bottom:none}
.todo-dot{flex-shrink:0;width:9px;height:9px;border-radius:50%;margin-top:7px;background:var(--blue)}
.todo.amber .todo-dot{background:var(--amber)} .todo.red .todo-dot{background:var(--red)}
.todo-due{flex-shrink:0;width:80px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:3px}
.todo-body{flex:1;min-width:0}
.todo-title{font-size:14px;line-height:1.5}
.todo-amt{font-size:15px;font-weight:700;margin-left:4px;font-variant-numeric:tabular-nums}
.todo-note{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.6}
.todo-x{flex-shrink:0;white-space:nowrap;padding-top:2px}
.todo.done .todo-body{opacity:.5}
.todo.done .todo-title{text-decoration:line-through}
.gauge-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g-num .lab{font-size:12px;color:var(--muted)}
.g-num .val{font-size:26px;font-weight:700;line-height:1.25;font-variant-numeric:tabular-nums}
.gbar{position:relative;height:16px;background:#edf0f7;border-radius:8px;margin:12px 0 6px}
.gbar .fill{height:100%;border-radius:8px;background:var(--blue);transition:width .3s}
.gbar .fill.f-green{background:var(--green)} .gbar .fill.f-red{background:var(--red)}
.gbar .mk{top:-4px;bottom:-4px}
.gbar .mk.fore{top:-7px;bottom:-7px}
.gbar-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11px;color:var(--muted)}
.gbar-legend i{display:inline-block;vertical-align:middle;margin-right:4px}
.lg-fill{width:12px;height:8px;border-radius:2px;background:var(--blue)}
.lg-mk{width:0;height:10px;border-left:2px solid var(--green)}
.lg-time{width:0;height:10px;border-left:2px dashed var(--amber)}
.lg-fore{width:0;height:12px;border-left:3px solid var(--purple)}
.hit-line{margin-top:8px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-width:0}
.stat .lab{font-size:11px;color:var(--muted)}
.stat .val{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .sub{font-size:11px;color:var(--muted);line-height:1.45}
.notes-title{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted)}
.note{display:flex;gap:8px;padding:5px 0;font-size:12.5px;line-height:1.55;align-items:flex-start}
.note i{flex-shrink:0;width:16px;height:16px;border-radius:50%;font-style:normal;color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;margin-top:2px}
.note.red i{background:var(--red)} .note.amber i{background:var(--amber)} .note.info i{background:var(--gray)} .note.ok i{background:var(--green)}
/* 本次导入发现了什么：一条细栏，明细点开才浮出来 */
.strip{background:#fff;border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:10px;padding:7px 14px;margin-top:12px;font-size:13px;line-height:1.7}
.inline-fold{display:inline-block;position:relative;margin-left:10px}
.inline-fold>summary{display:inline;list-style:none;cursor:pointer;color:var(--blue);font-size:12px}
.inline-fold>summary::-webkit-details-marker{display:none}
.inline-fold-body{position:absolute;left:0;top:calc(100% + 6px);z-index:40;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(15,23,42,.14);padding:8px 14px;min-width:340px;max-width:720px;line-height:1.8;cursor:default}
/* 本周期操作：下 PO 的比例表、OD、年底资金安排 */
.ins-head .big{font-size:19px;margin-left:4px}
.ins-sub.warn{color:var(--amber)} .ins-sub.bad{color:var(--red)} .ins-sub.muted{color:var(--muted)} .ins-sub.plan-ahead{color:var(--purple)}
.ins-sub.identify{margin-top:10px}
.flag{color:var(--amber);font-size:12px}
.issued{display:inline-block;margin-right:8px}
.po-part{margin-top:10px}
.po-part-head{display:flex;align-items:baseline;gap:10px;font-size:14px;flex-wrap:wrap}
.po-amt{font-size:17px;font-weight:700;color:var(--blue)}
.tbl-po{margin-top:4px;max-width:980px}
.tbl-po td.po-proj{border-right:1px solid var(--line);vertical-align:top;background:#fafbfe}
.tbl-po tr.first td{border-top:2px solid var(--line)}
.tbl-od{max-width:1000px}
.tbl-od tr.cur td{background:var(--blue-bg)}
.fold.sec{border:1px solid var(--line);border-radius:10px;padding:7px 14px;background:#fbfcff}
.fold.sec>summary{list-style:none;font-size:14px;color:var(--text);font-weight:600}
.fold.sec>summary::-webkit-details-marker{display:none}
.fold.sec>summary::before{content:'▸ ';color:var(--blue)}
.fold.sec[open]>summary::before{content:'▾ '}
.fold.sec[open]{padding-bottom:8px}
/* 来源健康度 */
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;white-space:nowrap}
.t-red{background:var(--red-bg);color:var(--red)} .t-amber{background:var(--amber-bg);color:var(--amber)} .t-green{background:var(--green-bg);color:var(--green)} .t-gray{background:#eef0f5;color:var(--muted)}
.tbl-health{max-width:1180px}
.tbl-health td.src{min-width:180px}
.tbl-health td.bar-cell{min-width:150px;width:190px}
.mini-bar{position:relative;height:12px;background:#edf0f7;border-radius:6px}
.mini-bar .fill{height:100%;border-radius:6px;background:var(--blue)}
.mini-bar .mk{top:-3px;bottom:-3px}
.mini-bar .mk.fore{top:-5px;bottom:-5px}
.mk.fore{border-left:3px solid var(--purple)}
.mk.fore.f-green{border-color:var(--green)} .mk.fore.f-amber{border-color:var(--amber)} .mk.fore.f-red{border-color:var(--red)}
.tbl-health tr.ok{display:none} .tbl-health.open tr.ok{display:table-row}
.tbl-health tr.fold-row td{color:var(--blue);cursor:pointer;font-size:12px;padding:5px 8px}
.bad{color:var(--red)} .warn{color:var(--amber)}
#opsPo,#opsOd,#opsYear,#opsSim,#srcCard,#foldChecks,#foldMonth,#teamCard{scroll-margin-top:112px}
/* ===== 预算来源页 / PO 台账 ===== */
.sec-title{font-size:14px;font-weight:600;margin:18px 0 6px;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px}
.tbl-health.full{max-width:none}
.sum-line{margin-bottom:10px;line-height:2}
.tbl-wallet{font-size:12.5px}
.tbl-wallet tr.sub-total td{background:#fafbfe;font-weight:600}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.ghost:hover{border-color:var(--line);background:var(--red-bg);color:var(--red)}
td.ops{white-space:nowrap;text-align:right}
.paste-preview{overflow-x:auto;margin:4px 0}
.paste-preview table{width:100%;border-collapse:collapse;font-size:12px}
.paste-preview th,.paste-preview td{padding:3px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.paste-preview th{color:var(--muted);font-weight:500}
.paste-preview td.num{text-align:right}
/* ===== 数据管理：状态面板、规划表、决策设置 ===== */
.st-row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px dashed var(--line)}
.st-row:last-of-type{border-bottom:none}
.st-ico{flex-shrink:0;width:36px;height:36px;border-radius:10px;background:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-size:18px}
.st-main{flex:1;min-width:0}
.st-name{font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.st-dot{width:8px;height:8px;border-radius:50%;background:var(--gray)}
.st-row.ok .st-dot{background:var(--green)} .st-row.warn .st-dot{background:var(--amber)} .st-row.none .st-dot{background:var(--gray)}
.st-state{font-weight:400}
.st-hint{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.6}
.st-btns{flex-shrink:0;display:flex;gap:8px;align-items:center;white-space:nowrap}
.grp{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.grp-lab{font-size:12px;color:var(--muted);width:84px;flex-shrink:0}
.cell-in{border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-size:12px;background:#fff}
.cell-in:focus{border-color:var(--blue);outline:none}
.tbl-plan input[data-f="amountW"],.tbl-plan input[data-f="target"]{text-align:right}
.tbl-plan tr.dead td{opacity:.6}
.t-blue{background:var(--blue-bg);color:var(--blue)}
.t-teal{background:var(--teal-bg);color:var(--teal)}
.anchor-row{display:flex;gap:8px 14px;flex-wrap:wrap}
.anchor-item{font-size:13px;display:inline-flex;align-items:center;gap:6px}
.anchor-item select{font-size:12px;padding:3px 6px;border:1px solid var(--line);border-radius:6px}
.ex-list{display:flex;gap:8px 14px;flex-wrap:wrap}
.ex-item{display:inline-flex;gap:6px;align-items:center;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:3px 6px 3px 10px}
.tbl tr.sub-total td{background:#fafbfe;font-weight:600}
#paramCard .form-grid{grid-template-columns:1fr}
#paramCard .field{gap:3px}
/* ===== 页内提示 ===== */
#toastRoot{position:fixed;bottom:16px;right:16px;z-index:100;display:flex;flex-direction:column-reverse;gap:8px;max-width:min(520px,92vw);pointer-events:none}
.toast{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-left:4px solid var(--green);border-radius:10px;padding:10px 12px;box-shadow:0 10px 30px rgba(15,23,42,.16);font-size:13px;line-height:1.7;pointer-events:auto;animation:tin .2s}
.toast.info{border-left-color:var(--blue)} .toast.warn{border-left-color:var(--amber)}
.toast-body{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word;max-height:50vh;overflow:auto}
.toast-x{flex-shrink:0;border:none;background:none;color:var(--muted);font-size:16px;line-height:1.2;cursor:pointer;padding:0 2px}
.toast-x:hover{color:var(--text)}
.toast.out{opacity:0;transition:opacity .25s}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.mini-bar .fill.f-green{background:var(--green)} .mini-bar .fill.f-red{background:var(--red)}
@media(max-width:1100px){.grid-2{grid-template-columns:1fr}}
@media print{.tabs,.topbar .banner,.btn{display:none!important}body{background:#fff}}
</style>
</head>
<body>
<div class="sticky-head">
<header class="topbar">
  <div><h1>📊 年度预算执行看板
    <button class="btn small" data-action="year:prev" title="上一年度">◀</button>
    <span class="year-badge" id="yearBadge"></span>
    <button class="btn small" data-action="year:next" title="下一年度">▶</button>
  </h1></div>
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <button class="btn" id="quickLoadBtn" data-action="data:openRecent" style="display:none">📂 载入数据文件</button>
    <button class="btn" id="datasetScanBtn" data-action="dataset:scan" style="display:none">📁 扫描数据集</button>
    <button class="btn primary" data-action="import:open">📥 导入平台数据</button>
    <div id="freshnessBanner"></div>
  </div>
</header>
<nav class="tabs" id="tabNav">
  <button data-tab="now" class="active">现在与行动</button>
  <button data-tab="budget">预算来源</button>
  <button data-tab="po">PO 台账</button>
  <button data-tab="data">数据管理</button>
</nav>
</div>
<main>
  <section id="tab-now" class="tab-panel active">
    <div id="onboard"></div>
    <div class="summary-bar" id="summaryBar"></div>
    <div id="newYearBox"></div>
    <div id="importChanges"></div>
    <div class="hero">
